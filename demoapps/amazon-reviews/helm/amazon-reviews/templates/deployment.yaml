apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amazon-reviews.fullname" . }}
  labels:
    {{- include "amazon-reviews.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "amazon-reviews.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "amazon-reviews.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "amazon-reviews.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "amazon-reviews.selectorLabels" . | nindent 20 }}
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: {{ .Chart.Name }}
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-Xmx{{ .Values.jvm.heapMax }} -Xms{{ .Values.jvm.heapMin }} {{ .Values.jvm.extraOpts }}"
            - name: HEVMESH_BASE_URL
              value: {{ .Values.hevmesh.baseUrl | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
